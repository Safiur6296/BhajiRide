name: Build & Direct Release BhaijiRide

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BhaijiRide.apk

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: BhaijiRide-apk
          path: BhaijiRide.apk

      - name: Publish Direct GitHub Release (In-App Auto-Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BhaijiRide v1.0.${{ github.run_number }}
          body: |
            ### BhaijiRide v1.0.${{ github.run_number }} Update
            - Direct in-app update asset for all active riders.
            - Continuous update triggered via GitHub Actions.
          files: BhaijiRide.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

